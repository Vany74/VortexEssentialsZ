# Plugins présentés dans le wiki (partie "joueurs"). Éditez librement puis relancez generate_wiki.py.
#
# verify: true  => description/commandes NON confirmées : la fiche est masquée tant que
#                  SHOW_UNVERIFIED = False dans generate_wiki.py. Complétez-la, puis retirez "verify".
# icon : lock, home, shop, crate, grave, combat, mic, skin, anvil, vortex, generic
#
# Les plugins d'administration (protection, sauvegarde, permissions...) ne sont volontairement
# pas listés : inutile de donner la liste exacte de vos plugins de sécurité aux joueurs.

plugins:
- name: VortexEssentials
  icon: vortex
  role: Items custom, armes, boutique, commandes, primes, spawners
  how:
  - 'Ouvrez le menu avec /vortex : catégories d''items (outils, armes légendaires, mythiques, secrètes), fonctionnalités, boosts de grade, profil,
    avec la recette de chaque item (clic gauche). Chaque item indique si son craft est illimité ou à quantité limitée.'
  - 'Sneak + clic droit avec un outil Vortex : réglages (zone, autosmelt, abattage d''arbres, Toucher de soie, vitesse de minage vanilla).'
  - 'Armes légendaires : 3 exemplaires maximum par arme sur le serveur et 2 par joueur. Armes et armures mythiques (et Secret Weapons) : un seul
    exemplaire par serveur, forgé avec un rituel.'
  - 'Le SMP démarre avec /smp start : les armes légendaires et mythiques se craftent 2 jours plus tard. La mace vanilla est limitée (quantité
    par serveur et par joueur).'
  - 'Boutique (/shop, /sell) : plus votre fortune est grande, plus les prix d''achat montent ; les items faciles à fabriquer se revendent très
    peu. Vos grades donnent bonus de vente et réductions d''achat.'
  - 'Commandes (/orders) : demandez des items en payant d''avance, ou livrez les commandes des autres joueurs et celles du serveur pour gagner
    de l''argent.'
  - 'Primes (/bounty <joueur> <montant>) : mettez une prime sur la tête d''un joueur ; celui qui le tue l''encaisse.'
  - 'Spawners empilables (/us shop) : mobs réels, auto-farm, stockage des drops et de l''XP, améliorations, joueurs autorisés, vente automatique.'
  - 'Crafts à rituel (/vortex rituals) : craftez puis attendez un court moment : l''item apparaît par terre à la fin du rituel.'
  - Les cooldowns de l'arme en main s'affichent à l'écran (/vortex hud pour les masquer).
  commands:
  - /vortex
  - /vortex list
  - /vortex preview <item>
  - /vortex boost
  - /vortex rituals
  - /shop
  - /sell
  - /orders
  - /bounty <joueur> <montant>
  - /us shop
  - /playtime
- name: AuthMe
  icon: lock
  role: Connexion sécurisée
  how:
  - Comptes premium et crack acceptés.
  - 'Première connexion : créez votre mot de passe avec /register.'
  - 'Les fois suivantes : connectez-vous avec /login.'
  commands:
  - /register <mot de passe> <mot de passe>
  - /login <mot de passe>
- name: ExcellentCrates
  icon: crate
  role: Caisses et clés
  how:
  - Chaque caisse s'ouvre avec une clé. Vos clés sont enregistrées sur votre compte.
  - Prévisualisez le contenu d'une caisse avant de l'ouvrir ; la récompense est tirée au sort.
  - Certaines caisses ont un délai entre deux ouvertures.
  commands:
  - /crates preview <caisse>
  - /crates open <caisse>
  - /crates key inspect
- name: EternalCombat
  icon: combat
  role: Anti combat-log
  how:
  - Dès que vous frappez ou êtes frappé, vous entrez en combat pendant quelques secondes.
  - Pendant le combat, se déconnecter est sanctionné et certaines actions peuvent être bloquées (élytres, inventaire, commandes, pose de blocs
    selon la configuration).
  commands:
  - /combatlog status <joueur>
- name: Simple Voice Chat
  icon: mic
  role: Chat vocal de proximité
  how:
  - Installez le mod Simple Voice Chat sur votre client (Fabric, Forge, NeoForge ou Quilt), dans la même version que le serveur.
  - 'En jeu, appuyez sur V pour ouvrir le menu : micro, volume, groupes.'
  - 'Vous entendez les joueurs proches de vous. Un groupe permet de parler à distance : /voicechat invite <joueur>.'
  - Sans le mod, vous jouez normalement mais sans voix.
  commands:
  - V (menu)
  - /voicechat invite <joueur>
- name: SkinsRestorer
  icon: skin
  role: Skins
  how:
  - Changez de skin avec /skin set <nom du skin>, ou revenez au vôtre avec /skin clear.
  commands:
  - /skin set <nom>
  - /skin clear
- name: BoundlessForging
  icon: anvil
  role: Enclume sans « Trop cher ! »
  how:
  - 'Plus de blocage « Too Expensive » : le coût maximum est ramené à 39 niveaux, et l''opération reste possible.'
  - 'Rien à faire de plus : utilisez l''enclume normalement.'
  commands: []
- name: AxGraves
  icon: grave
  role: Tombes à la mort
  how:
  - À votre mort, vos objets et votre XP sont rangés dans une tombe, à l'endroit où vous êtes mort.
  - Retournez sur place pour les récupérer. La tombe est protégée pendant un temps, puis elle expire.
  commands: []
